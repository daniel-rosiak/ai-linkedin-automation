<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Graphic</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Ambient glow elements */
    .glow-1 {
      filter: blur(120px);
      background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, rgba(0,0,0,0) 70%);
    }
    .glow-2 {
      filter: blur(120px);
      background: radial-gradient(circle, rgba(236,72,153,0.12) 0%, rgba(0,0,0,0) 70%);
    }
  </style>
</head>
<body class="bg-slate-950 text-white w-[1200px] h-[630px] flex items-center justify-center overflow-hidden relative">

  <!-- Ambient blur lights -->
  <div class="absolute w-[600px] h-[600px] -top-40 -left-40 glow-1 rounded-full z-0"></div>
  <div class="absolute w-[600px] h-[600px] -bottom-40 -right-40 glow-2 rounded-full z-0"></div>

  <!-- Decorative grid lines -->
  <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] opacity-30 z-0"></div>

  <!-- Main glass container -->
  <div class="w-[1100px] h-[530px] rounded-3xl backdrop-blur-xl bg-slate-900/50 border border-slate-800 p-12 flex flex-col justify-between shadow-2xl relative z-10">
    
    <!-- Top Row: Source Category / Branding -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Minimal modern logo icon -->
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
          </svg>
        </div>
        <span class="text-slate-400 font-semibold tracking-wider text-sm uppercase">Tech Insights</span>
      </div>
      
      <!-- Source Category Badge -->
      <div id="category" class="px-4 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 font-bold text-xs tracking-wider uppercase">
        Hacker News
      </div>
    </div>

    <!-- Center Row: Large, bold Title -->
    <div class="my-auto">
      <h1 id="title" class="text-[42px] font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-slate-100 via-indigo-100 to-slate-200 leading-tight">
        Scaling Laws for Autonomous LinkedIn Posting Agents in 2026
      </h1>
    </div>

    <!-- Bottom Row: Subtitle / Concept -->
    <div class="flex items-end justify-between border-t border-slate-800/60 pt-8">
      <div class="max-w-[75%]">
        <p id="subtitle" class="text-slate-400 text-lg font-medium leading-relaxed italic">
          How Multi-Agent architectures are driving professional content pipelines at scale.
        </p>
      </div>
      
      <!-- User / Branding Handle -->
      <div class="flex flex-col items-end">
        <span class="text-slate-500 text-xs font-semibold uppercase tracking-widest">Post Draft Asset</span>
        <span class="text-indigo-400 font-bold text-sm">@LinkedInAutomation</span>
      </div>
    </div>

  </div>

</body>
</html>
